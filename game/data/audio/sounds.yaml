    bus: SFX
    volume: -11
    pitch: [0.97, 1.03]
    priority: 50
    maxConcurrent: 4
    cooldownMs: 80
    positional: true
  snd_prism_support:
    files: [sfx/prism_support_01.wav]
    bus: SFX
    volume: -16
    pitch: [0.94, 1.08]
    priority: 50
    maxConcurrent: 6
    cooldownMs: 30
    positional: true
  snd_prism_tank_charge:
    files: [sfx/prism_tank_charge_01.wav]
    bus: SFX
