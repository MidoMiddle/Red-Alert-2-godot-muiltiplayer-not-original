# The build orders of the bots of the Union (docs/implementation/M5_first_bot.md, 4.7, step 5): the buildings in the order a bot
# builds them first. A step may come twice — the second refinery. A defense is placed facing the enemy by the bot itself. Every
# personality has three, one for each quality a level asks for: simple, standard, optimized (M8, 4.7, step 8).

# «Balanced»: the build order of M5 for «Medium» and above; «Easy» stops at the war factory.
standard:
  kind: build_order
  faction: union
  steps: [reactor, refinery, barracks, war_factory, refinery, reactor, radar, tesla_coil]

balanced_simple:
  kind: build_order
  faction: union
  steps: [reactor, refinery, barracks, war_factory]

# The optimized one of «Hard» and «Brutal» (M8 step 10): the army first — the ore of a map is soon mined out, and what goes into the
# radar and the tesla coil is missing in the battle that decides the match; the second refinery comes after the order.
balanced_optimized:
  kind: build_order
  faction: union
  steps: [reactor, refinery, barracks, war_factory, reactor]

# «Aggressor»: the barracks before the refinery, a second war factory soon, no defense.
aggressor_simple:
  kind: build_order
  faction: union
  steps: [reactor, barracks, refinery, war_factory]

aggressor_standard:
  kind: build_order
  faction: union
  steps: [reactor, barracks, refinery, war_factory, reactor, war_factory]

aggressor_optimized:
  kind: build_order
  faction: union
  steps: [reactor, refinery, barracks, war_factory, war_factory, reactor]

# «Builder»: two refineries, a sentry gun at once, two tesla coils once the radar stands.
builder_simple:
  kind: build_order
  faction: union
  steps: [reactor, refinery, barracks, sentry_bunker, war_factory]

builder_standard:
  kind: build_order
  faction: union
  steps: [reactor, refinery, barracks, sentry_bunker, refinery, reactor, war_factory, radar, tesla_coil, tesla_coil]

builder_optimized:
  kind: build_order
  faction: union
  steps: [reactor, refinery, refinery, barracks, sentry_bunker, war_factory, reactor, radar, tesla_coil, tesla_coil]

# «Saboteur»: the war factory early, for the fast flak tracks of its raids.
saboteur_standard:
  kind: build_order
  faction: union
  steps: [reactor, refinery, barracks, war_factory, reactor, radar]

saboteur_optimized:
  kind: build_order
  faction: union
  steps: [reactor, refinery, war_factory, barracks, reactor, radar]

# The armies of the bots of the Union (step 6; M11, the bot that knows every weapon): the share of every role — against soldiers,
# armour (for the fleet, ships), what flies and buildings — and of the fleet on a map whose water leads to the enemy. The bot picks the
# units of a role itself, the three that fight that enemy best for their cost among those it can build (Rts.AI UnitKnowledge); a role
# nothing fights yet leaves its share empty. The share a level picks against the enemy goes to the roles by what it fields. The shares
# are rounded to fixed point one by one and must still make 100% exactly.
standard_army:
  kind: army
  faction: union
  roles: { anti_armor: 45%, anti_infantry: 30%, anti_air: 10%, anti_building: 15% }
  navy: 30%

# «Aggressor»: armour first.
aggressor_army:
  kind: army
  faction: union
  roles: { anti_armor: 55%, anti_infantry: 25%, anti_air: 5%, anti_building: 15% }
  navy: 25%

# «Builder»: more against the air, a fleet of its own.
builder_army:
  kind: army
  faction: union
  roles: { anti_armor: 40%, anti_infantry: 35%, anti_air: 15%, anti_building: 10% }
  navy: 30%

# «Saboteur»: armour for its raids — a harvester is armoured (M8 step 10a).
saboteur_army:
  kind: army
  faction: union
  roles: { anti_armor: 50%, anti_infantry: 30%, anti_air: 5%, anti_building: 15% }
  navy: 20%
