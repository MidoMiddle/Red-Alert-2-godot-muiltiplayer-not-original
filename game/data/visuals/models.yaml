  # The civilian and industrial buildings of the map are low, as RA2's: a storey about 0.25 cells, a soldier 0.6 (measured against RA2,
  # 2026-10-26). Their models were made a storey to a cell: height_scale 0.35 squashes them upright, their footprints the same.
  # The civilian houses of the map (docs/map_elements/11_civilian_buildings): whole, damaged, abandoned (critically damaged, its soldiers
  # out) and ruins once it has fallen; with soldiers inside, the whole one (occupied) and the damaged one (damaged_occupied).
  # The shed of the map (docs/map_elements/11_civilian_buildings): a storey to a cell, squashed as the houses; whole, damaged, burning
  # (fire_1..2) and burnt down.
  building/neutral_shed: { file: map/shed/shed.glb, height: 0.5, height_scale: 0.35, damaged: map/shed_damaged/shed_damaged.glb,
                           abandoned: map/shed_abandoned/shed_abandoned.glb, ruins: map/shed_ruins/shed_ruins.glb }

