# The late buildings of the Union (docs/ra2_buildings/yaml_drafts/union, docs/content/names.md): working names of our own. Built,
# drawing power and opening the tech tree now; an ability that needs a mechanic of M11 is marked `ability_later` and does nothing
# yet — the projector and the silo fire nothing, the workshop repairs nothing. The shipyard stands on deep water and builds the ships
# (stage 2a).
naval_shipyard:  # shipyard on deep water; builds the ships (stage 2a)
  kind: building
  inherits: base_building
  name: Dockyard
  faction: union
  cost: 1000
  build_time: 42s
  hp: 1500
  sight: 10
  armor: concrete
  footprint: [4, 4]
  power: -20
  powered: true  # RA2: the Soviet shipyard needs power (not in Yuri's Revenge)
  extends_base: false
  adjacent: 12  # RA2 Adjacent=12
  water: true
  produces: [naval]
  exit_cell: [1, 4]
  prerequisites: [proc]
  capturable: false
  repairs_vehicles: true  # RA2 UnitRepair: it mends the ships beside it

service_depot:  # repairs the vehicles and ships beside it (stage 2c)
  kind: building
  inherits: base_building
  name: Field Workshop
  faction: union
  cost: 800
  build_time: 33.6s
  hp: 1200
  sight: 5
  footprint: [3, 3]
  power: -20
  repairs_vehicles: true
  prerequisites: [war_factory]

nuclear_reactor:  # late power, +2000; blows up when a shot brings it down (stage 2c)
  kind: building
  inherits: base_building
  name: Atomic Plant
  faction: union
  cost: 1000
  build_time: 42s
  hp: 1000
  sight: 5
  armor: concrete
  footprint: [4, 4]
  power: 2000
  death_weapon: atomic_plant_blast
  prerequisites: [tech]
  spy_effect: blackout
  provides: [power]  # RA2 prerequisite group POWER

cloning_vats:  # RA2 Cloning Vats (NACLON): every soldier the barracks train comes out a second time here, free, with or without power; a soldier sent in gives half its price back
  kind: building
  inherits: base_building
  name: Replication Vats
  faction: union
  cost: 2500
  build_time: 105s
  hp: 1000
  sight: 5
  footprint: [2, 2]
  power: -200
  prerequisites: [tech]
  build_limit: 1
  capturable: false
  clones_infantry: true

iron_curtain:  # superweapon: 3 x 3 cells cannot be hurt for 50 s, soldiers there die; charges 5 min (stage 2d)
  kind: building
  inherits: base_building
  name: Bastion Field Projector
  faction: union
  cost: 2500
  build_time: 105s
  hp: 750
  sight: 4
  armor: concrete
  footprint: [3, 3]
  power: -200
  prerequisites: [tech]
  capturable: false
  superweapon: curtain
  recharge: 300s
  powered: true
  build_limit: 1
  spy_effect: reset_charge

nuclear_missile_silo:  # superweapon: a missile of 600 over 10 cells, toxin after; charges 10 min (stage 2d)
  kind: building
  inherits: base_building
  name: Strategic Missile Silo
  faction: union
  cost: 5000
  build_time: 210s
  hp: 1000
  sight: 4
  armor: concrete
  footprint: [3, 3]
  power: -200
  prerequisites: [tech]
  capturable: false
  superweapon: missile
  recharge: 600s
  superweapon_weapon: nuclear_missile
  powered: true
  build_limit: 1
  spy_effect: reset_charge
