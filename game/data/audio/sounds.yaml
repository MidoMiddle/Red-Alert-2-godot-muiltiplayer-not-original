# Sound definitions (docs/implementation/M6_menus_skirmish.md, 4.8; the code is game/scripts/Audio/SoundLibrary.cs).
# Files are relative to game/assets/audio/ and come with the first sound set (step 14). A sound whose files are not there
# stays silent, and the console says so once. Priorities: EVA 100, voices 80, interface 70, blasts 60, shots 50, movement 30,
# ambience 10 (SoundPriority.cs).
sounds:
  snd_shot:
    files: [sfx/shot_01.wav, sfx/shot_02.wav, sfx/shot_03.wav]
    bus: SFX
    volume: -6            # dB
    pitch: [0.95, 1.05]   # random pitch, between these factors
    priority: 50          # 0-100, the more important the higher
    maxConcurrent: 6      # of this sound at once
    cooldownMs: 40        # not sooner than this after the last one
    positional: true      # placed by its point on the screen
  snd_impact:
    files: [sfx/impact_01.wav, sfx/impact_02.wav]
    bus: SFX
    volume: -9
    pitch: [0.9, 1.1]
    priority: 60
    maxConcurrent: 8
    cooldownMs: 60
    positional: true
  snd_explosion:
    files: [sfx/explosion_01.wav, sfx/explosion_02.wav, sfx/explosion_03.wav]
    bus: SFX
    volume: -3
    pitch: [0.9, 1.05]
    priority: 60
    maxConcurrent: 4
    cooldownMs: 80
    positional: true
  snd_unit_death:
    files: [sfx/death_01.wav, sfx/death_02.wav]
    bus: SFX
    volume: -6
    pitch: [0.92, 1.08]
    priority: 60
    maxConcurrent: 4
    cooldownMs: 100
    positional: true
  snd_ui_hover:
    files: [ui/hover_01.wav]
    bus: UI
    volume: -12
    pitch: [1.0, 1.0]
    priority: 70
    maxConcurrent: 1
    cooldownMs: 60
    positional: false
  snd_ui_click:
    files: [ui/click_01.wav]
    bus: UI
    volume: -9
    pitch: [0.98, 1.02]
    priority: 70
    maxConcurrent: 2
    cooldownMs: 60
    positional: false
  # The rest of the menus (InterfaceSounds.cs): back and cancel, the start of a match, a box ticked or cleared, a choice from a
  # list, a tab, a notch of a slider.
  snd_ui_back:
    files: [ui/back_01.wav]
    bus: UI
    volume: -9
    pitch: [0.98, 1.02]
    priority: 70
    maxConcurrent: 2
    cooldownMs: 60
    positional: false
  snd_ui_start:
    files: [ui/start_01.wav]
    bus: UI
    volume: -7
    pitch: [1.0, 1.0]
    priority: 70
    maxConcurrent: 1
    cooldownMs: 300
    positional: false
  snd_ui_toggle_on:
    files: [ui/toggle_on_01.wav]
    bus: UI
    volume: -10
    pitch: [0.98, 1.02]
    priority: 70
    maxConcurrent: 2
    cooldownMs: 60
    positional: false
  snd_ui_toggle_off:
    files: [ui/toggle_off_01.wav]
    bus: UI
    volume: -10
    pitch: [0.98, 1.02]
    priority: 70
    maxConcurrent: 2
    cooldownMs: 60
    positional: false
  snd_ui_select:
    files: [ui/select_01.wav]
    bus: UI
    volume: -10
    pitch: [0.98, 1.02]
    priority: 70
    maxConcurrent: 2
    cooldownMs: 60
    positional: false
  snd_ui_tab:
    files: [ui/tab_01.wav]
    bus: UI
    volume: -10
    pitch: [0.98, 1.02]
    priority: 70
    maxConcurrent: 1
    cooldownMs: 80
    positional: false
  snd_ui_tick:
    files: [ui/tick_01.wav]
    bus: UI
    volume: -14
    pitch: [0.95, 1.05]
    priority: 70
    maxConcurrent: 1
    cooldownMs: 35
    positional: false
  # The weapons by kind and the helicopter rotor. Which weapon fires which is in bindings.yaml; one not there fires snd_shot. The
  # rotor is the helicopter's loop (MovementSounds.cs, by the movement of bindings.yaml).
  snd_pistol:
    files: [sfx/pistol_01.wav, sfx/pistol_02.wav]
    bus: SFX
    volume: -8
    pitch: [0.95, 1.05]
    priority: 50
    maxConcurrent: 6
    cooldownMs: 40
    positional: true
  snd_rifle:
    files: [sfx/rifle_01.wav, sfx/rifle_02.wav, sfx/rifle_03.wav]
    bus: SFX
    volume: -8
    pitch: [0.95, 1.05]
    priority: 50
    maxConcurrent: 8
    cooldownMs: 30
    positional: true
  snd_rifle_burst:
    files: [sfx/rifle_burst_01.wav]
    bus: SFX
    volume: -8
    pitch: [0.94, 1.06]
    priority: 50
    maxConcurrent: 4
    cooldownMs: 120
    positional: true
  snd_tank_cannon:
    files: [sfx/tank_cannon_01.wav, sfx/tank_cannon_02.wav]
    bus: SFX
    volume: -4
    pitch: [0.93, 1.05]
    priority: 50
    maxConcurrent: 4
    cooldownMs: 80
    positional: true
  # A loop (edit/loop_mode in its .import), played by MovementSounds.cs while the helicopter flies, slower and quieter as it sets
  # down; maxConcurrent is how many helicopters are heard at once, the loudest.
  snd_rotor:
    files: [sfx/rotor_loop_01.wav]
    bus: SFX
    volume: -10
    pitch: [1.0, 1.0]
    priority: 30
    maxConcurrent: 4
    cooldownMs: 0
    positional: true
  # The prisms: the shot of the tank and of the tower, the support beam a tower sends into the one that fires, and the charges
  # before the shot (for the charge of the turret, IsChargeTurret). The shots by bindings.yaml, the support beam on TowerSupported;
  # the charges play nowhere yet, the simulation has no event of the start of a charge. Their middle is bright, so they sit lower
  # than the other shots.
  snd_prism_tank:
    files: [sfx/prism_tank_01.wav, sfx/prism_tank_02.wav]
    bus: SFX
    volume: -12
    pitch: [0.96, 1.04]
    priority: 50
    maxConcurrent: 4
    cooldownMs: 80
    positional: true
  snd_prism_tower:
