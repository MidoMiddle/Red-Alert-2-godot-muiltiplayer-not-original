# The weapons of the Alliance (docs/content/names.md), as the Union's in game/data/factions/union/weapons.yaml: reload is RA2 ROF / 15
# seconds, range in cells. The balance comes with M11c.
alliance_rifle:  # of the Rifleman
  kind: weapon
  name: Assault Rifle
  damage: 15
  reload: 1.33s
  range: 5
  projectile: bullet
  warhead: small_arms

alliance_light_cannon:  # of the Light Tank
  kind: weapon
  name: 105mm Cannon
  damage: 65
  reload: 3.33s
  range: 5.75
  projectile: shell
  warhead: ap_shell

alliance_pillbox_gun:  # of the Gun Nest
  kind: weapon
  name: Heavy Machine Gun
  damage: 40
  reload: 1.33s
  range: 5.5
  projectile: bullet
  warhead: small_arms

alliance_lens_beam:  # of the Lens Tower
  kind: weapon
  name: Lens Beam
  damage: 100
  reload: 4s
  range: 8
  projectile: bolt
  warhead: electric

alliance_siege_shell:  # of the Siege Battery
  kind: weapon
  name: Siege Shell
  damage: 150
  reload: 4s
  range: 10
  min_range: 2
  projectile: shell
  warhead: ap_shell

alliance_sky_guard_missile:  # of the Sky Guard: aircraft only
  kind: weapon
  name: Sky Guard Missile
  damage: 50
  reload: 1.33s
  range: 10
  projectile: rocket
  warhead: flak_air
  targets: [air]

alliance_dog_bite:  # of the Guard Dog, RA2 BadTeeth: 1000 so that the bite kills any soldier
  kind: weapon
  name: Bite
  damage: 1000
  reload: 2s
  range: 1.5
  projectile: pounce
  warhead: bite

alliance_double_pistols:  # of the Elite Commando, RA2 DoublePistols
  kind: weapon
  name: Double Pistols
  damage: 125
  reload: 0.67s
  range: 6
  projectile: bullet
  warhead: hollow_point

alliance_sniper_rifle:  # of the Marksman, RA2 AWP: reaches farther than it sees
  kind: weapon
  name: Sniper Rifle
  damage: 125
  reload: 10s
  range: 14
  projectile: bullet
  warhead: hollow_point

alliance_jetpack_guns:  # of the Jetpack Trooper, RA2 20mm: at the ground and the air
  kind: weapon
  name: 20mm Guns
  damage: 25
  reload: 2s
  range: 5
  projectile: bullet
  warhead: jetpack_rounds
  targets: [ground, air]

alliance_neutron_rifle:  # of the Time Trooper, RA2 NeutronRifle: the erasure a tick while the beam holds; it strikes again each second (RA2 120 frames; ours, to show the beam)
  kind: weapon
  name: Neutron Rifle
  damage: 8
  reload: 1s
  range: 5
  projectile: chrono_beam
  warhead: chrono

alliance_c4:  # the Elite Commando's C4, RA2 Sapper: on buildings only
  kind: weapon
  name: C4
  damage: 1
  reload: 6.67s
  range: 1.5
  projectile: pounce
  warhead: c4_plant

alliance_c4_charge:  # the C4 going off: the building comes down whatever its strength
  kind: weapon
  name: C4 Charge
  damage: 100000
  reload: 1s
  range: 1
  projectile: shell
  warhead: demolition
