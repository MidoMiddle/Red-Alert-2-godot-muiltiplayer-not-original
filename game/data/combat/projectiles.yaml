# Projectiles (docs/implementation/M4_combat.md, 4.8): how a shot gets to its target. `motion`: instant (hits at once), ballistic
# (an arc to the aim point) or homing (follows its target). `speed` in leptons per tick (256 = a cell), `arc` and `inaccuracy` in
# cells, `turn_rate` in BAngle units per tick (65536 = a full turn), `lifetime` in seconds.
bullet:
  kind: projectile
  name: Bullet
  motion: instant

bolt:
  kind: projectile
  name: Tesla Bolt
  motion: instant
  visual: electric_bolt

shell:
  kind: projectile
  name: Shell
  motion: ballistic
  speed: 40
  arc: 0.5

flak_shell:
  kind: projectile
  name: Flak
  motion: ballistic
  speed: 40
  arc: 1
  inaccuracy: 0.5

rocket:
  kind: projectile
  name: Rocket
  motion: homing
  speed: 30
  turn_rate: 8192
  lifetime: 6s

toxin_beam:  # the Toxin Trooper's beam (stage 3a)
  kind: projectile
  name: Toxin Beam
  motion: instant
  visual: toxin_beam

psi_link:  # Yuri's mind control: a purple beam, at once
  kind: projectile
  name: Psychic Link
  motion: instant
  visual: psi_beam

pounce:  # a dog's jump and bite: no shot to see
  kind: projectile
  name: Pounce
  motion: instant
  visual: none

chrono_beam:  # the Time Trooper's beam
  kind: projectile
  name: Chrono Beam
  motion: instant
  visual: chrono_beam

v3_shot:  # the rocket artillery's rocket, RA2 V3ROCKET: a slow flying thing anti-air can bring down (50 hp, special_2); speed and arc are ours, slower than a homing missile
  kind: projectile
  name: V3 Rocket
  motion: ballistic
  speed: 20
  arc: 2
  hp: 50
  armor: special_2

prism_ray:  # the beam tank's beam and its splinters
  kind: projectile
  name: Prism Ray
  motion: instant
  visual: prism_ray

torpedo:  # the submarine's torpedo (stage 3e): it follows its target under the water
  kind: projectile
  name: Torpedo
  motion: homing
  speed: 20
  turn_rate: 4096
  lifetime: 8s
  visual: torpedo

dreadnought_missile:  # the dreadnought's missile, RA2 DMISL: a flying thing anti-air can bring down (50 hp, special_2); speed and arc ours
  kind: projectile
  name: Dreadnought Missile
  motion: ballistic
  speed: 30
  arc: 3
  hp: 50
  armor: special_2

sonic:  # the dolphin's wave
  kind: projectile
  name: Sonic Wave
  motion: instant
  visual: sonic

nuclear_missile_shot:  # the silo's missile: it climbs high and falls; nothing brings it down (RA2); the speed is ours
  kind: projectile
  name: Nuclear Missile
  motion: ballistic
  speed: 25
  arc: 6
