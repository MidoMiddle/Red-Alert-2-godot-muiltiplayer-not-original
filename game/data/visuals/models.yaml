# The table of models (docs/art/model_standards.md): what in the game has a model, its file under game/assets/models/ and how it
# sits. An object not here — or whose file is missing — is drawn with its placeholder, as before.
#
# Keys:
#   building/<id>   a building of the players (game/data/factions) or of the map (neutral_*, tech_*): pivot at the centre of the
#                   footprint on the ground; its team_mask node takes the owner's colour
#   unit/<id>       a unit (game/data/factions): pivot at the centre on the ground, front to -Z; a turret node turns on its own
#   object/<id>     a map object (pine_tree is drawn as a tree/<shape>): pivot at the centre of the cell on the ground
#   tree/<shape>    a tree of a climate: pine (snow), broadleaf_small and broadleaf_big (temperate, urban), palm and cactus (desert);
#                   the holo tank's disguise too
#   ore/<kind>      the clusters of a field: ore and gems (the file only: the field scales and turns them)
#   bridge/<piece>  a piece of the low wooden bridge, a segment three cells across, made along x (MapObjects.AddWoodenBridge)
#   crate/supply    a crate of a match (M11 a6): pivot at the centre of its cell on the ground
#   <key>@<climate> the model of the same thing on the maps of one climate (urban, winter…): drawn there before the key's own
# Fields: file — or files: [a list of kinds of it], each cell picks one — (one of the two is required), scale (1), yaw in degrees
# (0), offset [x, y, z] in cells ([0, 0, 0]), jitter — the share the size of each varies either way, 0…0.5 (0), spin — each turned
# any way (false), height in cells for the bars over a building (its look's when 0), climates — the climates it is drawn in (all
# when left out). The pick goes by the cell: the same tree is the same cactus every time, neighbours differ.
# damaged, damaged_occupied, occupied, abandoned, ruins — a building's file in its states: damaged (a quarter to a half of its hit
# points), with soldiers inside (damaged_occupied for a damaged one, occupied for a whole one), abandoned (under a quarter: its soldiers
# come out, the file of the critically damaged one) and fallen (the ruins stay on its footprint); without one, the file above is drawn.
# Its nodes fire_1, fire_2… stand the flames of an abandoned one.
format: models/1
models:
  # The crates of a match (M11 a6): the supply crate of the map's props.
  crate/supply:               { file: map/prop_supply_crate/prop_supply_crate.glb }

  # The snowy spruce of the winter maps (docs/map_elements/07_trees): four kinds, each cell picks one, turned any way and a little bigger
  # or smaller; made at the size the game draws a tree. Felled, it leaves the stump every tree leaves.
  tree/pine:                  { files: [map/tree_spruce_01/tree_spruce_01.glb, map/tree_spruce_02/tree_spruce_02.glb,
                                        map/tree_spruce_03/tree_spruce_03.glb, map/tree_spruce_04/tree_spruce_04.glb], spin: true, jitter: 0.15 }
  # The broadleaf trees of the temperate and city maps, now and then by the sea (docs/temperate_elements/01_deciduous_tree): a small
  # one — a lime or a birch — and a big one — an oak or a chestnut —, each cell picks one of its two, turned any way and a little bigger
  # or smaller; made at the size the game draws a tree. Felled, it leaves the stump every tree leaves.
  tree/broadleaf_small:       { files: [map/tree_deciduous_01/tree_deciduous_01.glb, map/tree_deciduous_02/tree_deciduous_02.glb],
                                spin: true, jitter: 0.15 }
  tree/broadleaf_big:         { files: [map/tree_deciduous_03/tree_deciduous_03.glb, map/tree_deciduous_04/tree_deciduous_04.glb],
                                spin: true, jitter: 0.15 }
  # The palm of the coast and of the desert's oases (docs/beach_elements/02_palm): three kinds, each cell picks one, turned any way and
  # a little bigger or smaller; made at the size the game draws a tree. Felled, it leaves the stump every tree leaves.
  tree/palm:                  { files: [beach/tree_palm_01/tree_palm_01.glb, beach/tree_palm_02/tree_palm_02.glb,
                                        beach/tree_palm_03/tree_palm_03.glb], spin: true, jitter: 0.15 }
  # The cactus of the desert (docs/desert_elements/04_cactus): the desert draws half its trees as cacti (TreeShapes); three kinds, a
  # tall one with two arms, a low cluster and one with a single arm, each cell picks one, turned any way; made at the size the game
  # draws a tree. Felled, it leaves the stump every tree leaves.
  tree/cactus:                { files: [desert/cactus_01/cactus_01.glb, desert/cactus_02/cactus_02.glb,
                                        desert/cactus_03/cactus_03.glb], spin: true, jitter: 0.15 }
  # The dry shrub of the desert (docs/desert_elements/05_dry_shrub): a tuft of dry twigs or a tumbleweed, everyone tramples it; each
  # cell picks one, turned any way.
  object/dry_shrub:           { files: [desert/desert_dry_shrub/desert_dry_shrub.glb, desert/tumbleweed/tumbleweed.glb], spin: true,
                                jitter: 0.15 }
  # What the sea throws up on a beach (docs/beach_elements/03_driftwood): a bleached trunk, a forked branch or a heap of planks, a
  # canister and seaweed — the map object driftwood, which stops nobody; each cell picks one, turned any way.
  object/driftwood:           { files: [beach/prop_driftwood/prop_driftwood.glb, beach/prop_driftwood_branch/prop_driftwood_branch.glb,
                                        beach/prop_beach_debris/prop_beach_debris.glb], spin: true, jitter: 0.1 }
  # The beach umbrella (docs/beach_elements/04_beach_umbrella): one shape in three colourings, red and white, yellow and blue, green
  # and white; each cell picks one. Its canopy is a node of its own (canopy), to sway.
  object/beach_umbrella:      { files: [beach/beach_umbrella/beach_umbrella.glb, beach/beach_umbrella_yellow/beach_umbrella_yellow.glb,
                                        beach/beach_umbrella_green/beach_umbrella_green.glb], spin: true, jitter: 0.08 }
  # The sun lounger (docs/beach_elements/05_sun_lounger): one shape in three fabrics, blue and white stripes, turquoise, yellow; each
  # cell picks one.
  object/sun_lounger:         { files: [beach/beach_sun_lounger/beach_sun_lounger.glb,
                                        beach/beach_sun_lounger_turquoise/beach_sun_lounger_turquoise.glb,
                                        beach/beach_sun_lounger_yellow/beach_sun_lounger_yellow.glb], spin: true }
  # The beach shower (docs/beach_elements/07_beach_shower): its pipe, its head and the pad under it; water_anchor under the head for the
  # water to fall from.
  object/beach_shower:        { file: beach/beach_shower/beach_shower.glb, spin: true }
  # The volleyball net (docs/beach_elements/09_volleyball_net): its posts and the court's tapes, and the net, its mesh in strings.
  object/volleyball_net:      { file: beach/beach_volleyball_net/beach_volleyball_net.glb, spin: true }
  # The boat drawn up on a beach (docs/beach_elements/17_beached_boat): blue, green or white, each cell picks one; its hull and the oar
  # beside it nodes of their own.
  object/beached_boat:        { files: [beach/beached_boat/beached_boat.glb, beach/beached_boat_green/beached_boat_green.glb,
                                        beach/beached_boat_white/beached_boat_white.glb], spin: true }
  # The fishing nets drying on poles (docs/beach_elements/19_fishing_nets): the poles and the net, its mesh in cords.
  object/fishing_nets:        { file: beach/fishing_nets/fishing_nets.glb, spin: true }

  # The farm (docs/temperate_elements). The hedge (02_hedge): a block of clipped hedge filling its cell, its edges straight at one
  # height so neighbours join on every side; three kinds, each cell picks one, not turned.
  object/hedge:               { files: [farm/hedge_section/hedge_section.glb, farm/hedge_section_rounded/hedge_section_rounded.glb,
                                        farm/hedge_section_ragged/hedge_section_ragged.glb] }
  # Hay (05_hay_bale): a round bale, a stack of square bales or a haystack on loose straw; each cell picks one, turned any way.
  object/hay_bale:            { files: [farm/hay_bale/hay_bale.glb, farm/hay_bale_square/hay_bale_square.glb,
                                        farm/hay_bale_heap/hay_bale_heap.glb], spin: true, jitter: 0.06 }
  # The village well (06_well): a stone ring with water, a shingled roof on two posts, a winch with a bucket; nodes body, roof, winch.
  object/well:                { file: farm/well/well.glb, spin: true }
  # The farm tractor (12_farm_tractor): red or blue, each cell picks one, parked any way; its wheels are nodes wheel_rear and wheel_front.
  object/farm_tractor:        { files: [farm/farm_tractor/farm_tractor.glb, farm/farm_tractor_blue/farm_tractor_blue.glb], spin: true }

