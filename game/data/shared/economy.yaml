# The general rules of the economy (docs/implementation/M3_base_economy.md, 4.10). The engine needs exactly one record.
economy:
  kind: economy
  name: Economy
  # Production under low power runs at output / drain, never slower than low_power_min_rate nor faster than low_power_max_rate
  # (RA2 MinLowPowerProductionSpeed=0.5, MaxLowPowerProductionSpeed=0.8).
  low_power_min_rate: 50%
  low_power_max_rate: 80%
  # Every factory of a category beyond the first multiplies the build time by this (RA2 MultipleFactory=0.8): 1, 0.8, 0.64…
  multiple_factory: 80%
  # Ore (4.12): 12 stages per cell, 0…11; a stage is worth ore_value (gems: gem_value), so a full cell of ore holds 300.
  ore_value: 25
  gem_value: 50
  # Every ore_growth_interval each cell of ore grows a stage by ore_growth_chance; from ore_spread_stage on it may also seed a
  # neighbour of clear or rough land with ore of stage 0, by ore_spread_chance. Gems neither grow nor spread. 40 s (was 30 s): a
  # field grows back a quarter slower, so one home field no longer pays for a whole match.
  ore_growth_interval: 40s
  ore_growth_chance: 20%
  ore_spread_stage: 6
  ore_spread_chance: 5%
  # Sources (step 16): every source_interval an ore or gem source throws one stage of its own resource onto a cell within
  # source_radius — a stage more on a cell of it, stage 0 on an empty cell that can take ore. 6 s (was 4 s): an ore source brings
  # 10 stages, 250 credits a minute (was 375), a gem source 500 (was 750).
  source_interval: 6s
  source_radius: 3
  # A sold building gives back sell_refund of its cost times its share of hit points. A repair gives repair_rate hit points every
  # repair_delay (RA2 RepairStep=8 every RepairRate/URepairRate=.016 minutes, 14 frames); from nothing to full it costs repair_cost
  # of the building's or the vehicle's cost (RA2 RepairPercent=15%).
  sell_refund: 50%
  repair_cost: 15%
  repair_rate: 8
  repair_delay: 14
