# The guardrail along a highway (docs/map_elements/04_roads, «Отбойник»): it stops only infantry; wheels and tracks drive over it
# and flatten it, and fire breaks it.
highway_guardrail:
  kind: map_object
  name: Highway guardrail
  cover: 0.2
  blocks: [foot]
  hp: 120
  crushed_by: [track, wheel]

# The edge of a quay (docs/naval_elements/09_quay_wall): its coping, bollards, fenders and now and then a ladder down to the water, on
# the cliff cell of a quay's wall. It stands where nobody goes (a cliff), so it stops nobody, and nothing breaks it.
quay_edge:
  kind: map_object
  name: Quay edge

# On the water (docs/naval_elements): the rocks of a reef just out of the sea stop all that moves on it, ships, amphibians and hovers,
# and only heavy fire breaks them; an ice floe of the winter sea stops the ships, an amphibian climbs over it.
reef_rocks:
  kind: map_object
  name: Reef
  blocks: [amphibious, hover, naval]
  hp: 3000
  water: true

ice_floe:
  kind: map_object
  name: Ice floe
  blocks: [naval]
  hp: 800
  water: true

# A buoy (docs/beach_elements/13_buoy): a float with a light that marks the swimmers' water off a beach; it stops nobody, ships and
# amphibians pass it, and a shot sinks it.
buoy:
  kind: map_object
  name: Buoy
  hp: 50
  water: true

# A slipway (docs/beach_elements/15_slipway): a ribbed concrete ramp on the beach down into the water, where boats are let down; it
# stops nobody, and amphibians come ashore on it as anywhere. Concrete, hard to break.
slipway:
  kind: map_object
  name: Slipway
  hp: 2000

# A breakwater (docs/beach_elements/16_breakwater): stone blocks heaped in the water off a beach or a harbour; nothing on the water
# passes it. Heavy weapons break a block, and the water is open again.
breakwater:
  kind: map_object
  name: Breakwater
  blocks: [amphibious, hover, naval]
  hp: 2500
  water: true
