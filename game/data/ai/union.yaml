# The build orders of the bots of the Union (docs/implementation/M5_first_bot.md, 4.7, step 5): the buildings in the order a bot
# builds them first. A step may come twice — the second refinery. A defense is placed facing the enemy by the bot itself.
standard:
  kind: build_order
  faction: union
  steps: [reactor, refinery, barracks, refinery, war_factory, reactor, radar, tesla_coil, tech_center]

# The army of the bots of the Union (step 6): the share of every kind of unit. Against an enemy of mostly infantry the units of
# against_infantry gain, against mostly vehicles those of against_vehicles; a kind that cannot be built yet leaves its share to the rest.
standard_army:
  kind: army
  faction: union
  shares: { heavy_tank: 40%, conscript: 25%, rocketeer: 20%, support_vehicle: 10%, tesla_tank: 5% }
  against_infantry: [heavy_tank, support_vehicle]
  against_vehicles: [rocketeer, tesla_tank]
