# The civilians of the maps (docs/map_elements/13_civilians): people of nobody, of no faction, never built. They come out of their houses
# (`homes`, buildings of the map with `shelter: true`) at the start of a match, rest by the gathering points of their place (`gathers_at`,
# objects and buildings of the map), stroll between them, run from danger and hide in houses (CivilianSystem). Only on maps of their
# `climates`. The numbers of RA2's civilians (CIV1-3, CIVB*, CIVS*): 50 hit points, no armor, speed 4 (24), sight 2; crushed by vehicles.

base_civilian:
  kind: unit
  abstract: true
  inherits: base_infantry
  civilian: true
  prerequisites: []
  cost: 0
  build_time: 0s
  hp: 50
  sight: 2
  threat: 0
  trainable: false

civ_man:  # a passer-by in town clothes
  kind: unit
  inherits: base_civilian
  name: Civilian
  climates: [urban, temperate, coast, desert]
  homes: [neutral_house_a, neutral_apartment, neutral_office, neutral_hotel, neutral_shop, neutral_cafe, neutral_school, neutral_church]
  gathers_at: [bench, bus_stop, street_stall, flowerbed, phone_booth, neutral_shop, neutral_kiosk, neutral_cafe, neutral_fountain, neutral_school, neutral_church, neutral_office, neutral_hotel, neutral_bank]

civ_woman:  # a passer-by in town clothes
  kind: unit
  inherits: base_civilian
  name: Civilian
  climates: [urban, temperate, coast, desert]
  homes: [neutral_house_a, neutral_apartment, neutral_office, neutral_hotel, neutral_shop, neutral_cafe, neutral_school, neutral_church]
  gathers_at: [bench, bus_stop, street_stall, flowerbed, phone_booth, neutral_shop, neutral_kiosk, neutral_cafe, neutral_fountain, neutral_school, neutral_church, neutral_office, neutral_hotel, neutral_bank]

civ_winter_man:  # a villager in a puffer jacket, a knitted hat and a scarf (RA2 CIVSFM, CIVSTM)
  kind: unit
  inherits: base_civilian
  name: Civilian
  climates: [winter]
  homes: [neutral_house_a, neutral_apartment, neutral_office, neutral_hotel, neutral_shop, neutral_cafe, neutral_school, neutral_church, neutral_farmhouse]
  gathers_at: [bench, bus_stop, street_stall, well, neutral_shop, neutral_kiosk, neutral_cafe, neutral_fountain, neutral_school, neutral_church, neutral_office, neutral_hotel, neutral_bank, neutral_farmhouse]

civ_winter_woman:  # a villager in a long winter coat (RA2 CIVSF)
  kind: unit
  inherits: base_civilian
  name: Civilian
  climates: [winter]
  homes: [neutral_house_a, neutral_apartment, neutral_office, neutral_hotel, neutral_shop, neutral_cafe, neutral_school, neutral_church, neutral_farmhouse]
  gathers_at: [bench, bus_stop, street_stall, well, neutral_shop, neutral_kiosk, neutral_cafe, neutral_fountain, neutral_school, neutral_church, neutral_office, neutral_hotel, neutral_bank, neutral_farmhouse]

civ_beach_man:  # a beachgoer in shorts (RA2 CIVBFM, CIVBTM; docs/beach_elements/10_beachgoers)
  kind: unit
  inherits: base_civilian
  name: Beachgoer
