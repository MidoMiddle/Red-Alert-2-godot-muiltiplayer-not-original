# The buildings of the Alliance (docs/ra2_buildings/yaml_drafts/alliance, docs/content/names.md): working names of our own, numbers
# of the drafts; see templates.yaml. Footprints the drafts left open take the size of the Union building of the same role, so a base
# fits the starts of the ready maps. An ability that needs a mechanic of M11 is marked `ability_later`: the building is built, draws
# power and opens the tech tree, and does nothing else yet.
alliance_construction_yard:  # base; comes from the MCV
  kind: building
  inherits: base_building
  name: Command Yard
  faction: alliance
  cost: 3000
  build_time: 126s
  hp: 1000
  sight: 8
  armor: concrete
  footprint: [3, 3]
  produces: [building, defense]

alliance_power_plant:  # power plant, +200
  kind: building
  inherits: base_building
  name: Power Station
  faction: alliance
  cost: 800
  build_time: 33.6s
  hp: 750
  sight: 4
  footprint: [2, 2]
  power: 200
  prerequisites: [alliance_construction_yard]

