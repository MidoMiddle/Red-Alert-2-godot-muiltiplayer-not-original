# Черновики записей набора пустыни (docs/desert_elements). Игра эти файлы не читает.
# Схема, статусы и классы прочности: docs/elements_data/README.md. Статусы всех папок: index/desert.md.
# hp: здание низкая 300, средняя 800, высокая 1500; объект карты низкая 50, средняя 400, высокая 1500 (предложение, баланс в M4).
# «Блокирует всех наземных» записано как blocks: all (в коде AllMovers: все движители, корабли на объектах не стоят).
# Здания: блокировка задаётся видом здания, ключ blocks не ставим (как в примере neutral_factory_hall).
# Без записи: песок (тип земли), каньон (рельеф), оазис, песчаная буря, верблюды и стервятники.

rock_mesa:
  kind: map_object
  hp: 1500          # высокая
  blocks: all       # всех наземных
  burns: false      # не горит
  # размер 2x2 в документе: footprint только у зданий, объект карты в коде занимает одну клетку (расхождение)
  # значения как у wall_stone (map.yaml): проверить, не один вид
  # в документе не задано: crushed_by (сминание), stump (пень), speed (замедление), explodes (взрыв)

cactus:
  kind: map_object
  hp: 50            # низкая; документ «ломается от одного урона» с 50 не сходится, проверить в M4
  blocks: all       # всех наземных
  stump: true       # сломанный кактус — пень, клетка проходима
  burns: false      # не горит
  # в документе не задано: crushed_by (сминание), speed (замедление), explodes (взрыв)

dry_shrub:
  kind: map_object
  hp: 50            # низкая
  blocks: []        # не блокирует ни пехоту, ни технику
  burns: true       # кустарник горит очень быстро; перекати-поле — в этой же записи, катится по ветру в коде
  # в документе не задано: crushed_by (сминание), stump (пень), speed (замедление), explodes (взрыв)

rock_arch:
  kind: map_object
  hp: 1500          # высокая
  blocks: all       # всех наземных; проход под аркой открыт в документе
  burns: false      # не горит
  # размер 2x1 в документе: footprint только у зданий, объект карты в коде занимает одну клетку (расхождение)
  # в документе не задано: crushed_by (сминание), stump (пень), speed (замедление), explodes (взрыв)

neutral_adobe_house:
  kind: neutral_building
  footprint: [2, 2]
  hp: 800           # средняя
  garrison: 2       # предварительно; в документе открыто: 2 или 3
  capturable: false
  burns: false      # глина не горит
  # в документе не задано: explodes (взрыв), height (высота)

neutral_ancient_ruins:
  kind: neutral_building
  footprint: [2, 2]
  hp: 1500          # высокая, камень
  garrison: 0       # комнат для бойцов нет
  capturable: false
  burns: false      # не горит
  # в документе не задано: explodes (взрыв), height (высота)
