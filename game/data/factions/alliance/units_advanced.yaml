# The late units of the Alliance (docs/ra2_units/yaml_drafts/alliance, docs/content/names.md): working names of our own, numbers of the
# drafts, prerequisites turned to the Alliance's buildings. Unarmed for now (ability_later); ships and boats come from the shipyard on the
# water (category naval, stage 2a); aircraft fly and come from the air command (category aircraft, stage 2b). The commando of the sea is left out: RA2 never builds it in a skirmish.

alliance_engineer:  # takes a building of the enemy, mends its own (stage 3b)
  kind: unit
  inherits: base_infantry
  name: Field Engineer
  faction: alliance
  cost: 500
  build_time: 21s
  hp: 75
  threat: 5
  speed: 24
  sight: 4
  prerequisites: [alliance_barracks]
  engineer: true
  ifv_weapon: ifv_repair_arm
  trainable: false  # RA2 Trainable=no (loose ends, stage 3)

