# Черновики записей пляжного набора (docs/beach_elements). Игра эти файлы не читает.
# Схема, статусы и классы прочности: docs/elements_data/README.md.
# hp: объект карты низкая 50, средняя 400, высокая 1500; здание низкая 300, средняя 800, высокая 1500 (предложение, баланс в M4).
# Здания: блокировка всех наземных задаётся видом здания, ключ blocks не ставим (как в примере neutral_factory_hall).
# blocks: all означает «всех наземных» (в коде AllMovers, как у pine_tree).
# Владелец (нейтральный), «влияет на победу: нет» и варианты моделей в схеме нет, здесь не записаны.
# Без записи: песок (тип земли beach уже в коде), отдыхающие (житель), пирс (мост без segment_hp в документе). См. index/beach.md.

# 02 Пальма. Статус: ждёт M11e.
palm:
  kind: map_object
  hp: 400           # средняя, как pine_tree в коде
  blocks: all       # всех наземных
  stump: true       # пень остаётся, клетка проходима
  burns: true       # листья горят быстро
  garrison: 0
  capturable: false
  # в документе не задано: crushed_by (сминание), speed (замедление), explodes (взрыв), height (высота)

# 03 Коряга. Статус: ждёт M11e.
driftwood:
  kind: map_object
  hp: 400           # средняя
  blocks: all       # блокирует всех наземных
  burns: false      # не горит
  garrison: 0
  capturable: false
  # расхождение: документ «разрушается тяжёлым оружием, как валун», но валун неразрушим (09_props, boulder в коде: MaxHp 0)
  # в документе не задано: crushed_by (сминание), speed (замедление), stump (пень, остаток — обломки), explodes (взрыв), height (высота)

