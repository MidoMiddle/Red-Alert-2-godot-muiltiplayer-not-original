# Build and test on every push and pull request (docs/implementation/M0_foundation.md, 4.12).
# The test matrix is the cross-platform determinism check: golden values captured on macOS
# must be reproduced bit for bit on Windows and Linux, in Debug and Release.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.configuration }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Simulation tests
        run: dotnet test tests/Rts.Simulation.Tests -c ${{ matrix.configuration }} --logger "trx;LogFileName=simulation.trx" --results-directory test-results

      - name: Analyzer tests
        run: dotnet test tests/Rts.Analyzers.Tests -c ${{ matrix.configuration }} --logger "trx;LogFileName=analyzers.trx" --results-directory test-results

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.configuration }}
          path: test-results

  build-client:
    name: build client (Godot C#)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build the whole solution, including the Godot client
        run: dotnet build RtsGame.sln -c Debug

      # The load scenario with a stopwatch (docs/implementation/M2_unit_control.md, 4.15): only that it runs, no time limits,
      # since CI machines differ. The numbers that count are measured by hand and kept in the M2 journal.
      - name: Benchmark harness smoke run
        run: dotnet run -c Release --project src/Rts.Simulation.Benchmarks -- --load
