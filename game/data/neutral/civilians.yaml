  gathers_at: [sun_lounger, beach_umbrella, beach_shower, volleyball_net, neutral_beach_bar, neutral_lifeguard_tower, pier_wood]

civ_beach_woman:  # a beachgoer in a sundress or a swimsuit (RA2 CIVBF)
  kind: unit
  inherits: base_civilian
  name: Beachgoer
  climates: [coast]
