    pitch: [0.97, 1.03]
    priority: 50
    maxConcurrent: 4
    cooldownMs: 80
    positional: true
  snd_prism_tower_charge:
    files: [sfx/prism_tower_charge_01.wav]
    bus: SFX
    volume: -15
    pitch: [0.97, 1.03]
    priority: 50
    maxConcurrent: 4
    cooldownMs: 80
    positional: true
  # The fighter jet: the engine as a loop (edit/loop_mode in its .import), played by MovementSounds.cs like the rotor, and a pass
  # overhead, for a plane that flies over; nothing plays the pass yet.
  snd_jet:
    files: [sfx/jet_loop_01.wav]
    bus: SFX
    volume: -12
    pitch: [1.0, 1.0]
    priority: 30
    maxConcurrent: 4
    cooldownMs: 0
    positional: true
  snd_jet_flyby:
    files: [sfx/jet_flyby_01.wav, sfx/jet_flyby_02.wav]
    bus: SFX
    volume: -6
    pitch: [0.95, 1.05]
    priority: 30
    maxConcurrent: 3
    cooldownMs: 300
    positional: true
  # The bridges (docs/map_elements/05_bridges): a wooden span broken by fire, the whole wooden bridge under C4, a high concrete
  # bridge coming down whole. Which bridge plays which is in bindings.yaml.
  snd_bridge_wood_span:
    files: [sfx/bridge_wood_span_01.wav, sfx/bridge_wood_span_02.wav]
    bus: SFX
