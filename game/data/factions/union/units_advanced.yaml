# The late units of the Union (docs/ra2_units/yaml_drafts/union, docs/content/names.md): working names of our own, numbers of the
# drafts. Unarmed for now — their weapons and abilities come with the third stage of filling the game (ability_later). Ships and boats
# are built by the shipyard on the water (category naval, stage 2a); the airship flies (category aircraft, stage 2b) and comes from
# the war factory, as in RA2 — its locomotor is not used in flight. Units of a single country in RA2 are the whole faction's for now.

