# The buildings of the Union (docs/implementation/M3_base_economy.md, 4.6); see templates.yaml.
# The simulation builds them from M3 step 6 on.
construction_yard:  # base; comes from the MCV
  kind: building
  inherits: base_building
  name: Construction Yard
  faction: union
  cost: 3000
  build_time: 126s
  hp: 1000
  sight: 8
  armor: concrete
  footprint: [3, 3]
  produces: [building, defense]

reactor:  # power plant, +150
  kind: building
  inherits: base_building
  name: Reactor
  faction: union
  cost: 600
  build_time: 25.2s
  hp: 750
  sight: 4
  footprint: [2, 2]
  power: 150
  prerequisites: [construction_yard]

refinery:  # ore processing; gives a free harvester
  kind: building
  inherits: base_building
  name: Refinery
  faction: union
  cost: 2000
  build_time: 84s
  hp: 1000
  sight: 4
  footprint: [3, 3]
  power: -50
  # The harvesters unload standing under the middle of the refinery.
  dock_cell: [1, 3]
  prerequisites: [reactor]

barracks:  # infantry production
  kind: building
  inherits: base_building
  name: Barracks
  faction: union
  cost: 500
  build_time: 21s
  hp: 500
  sight: 6
  armor: steel
  footprint: [2, 2]
  power: -10
  produces: [infantry]
  exit_cell: [1, 2]
  prerequisites: [reactor]

war_factory:  # vehicle production
  kind: building
  inherits: base_building
  name: War Factory
  faction: union
  cost: 2000
  build_time: 84s
  hp: 1000
  sight: 4
  footprint: [3, 4]
  power: -25
  # The Union's airship comes from the war factory too, as in RA2 (stage 2b).
  produces: [vehicle, aircraft]
  exit_cell: [1, 4]
  prerequisites: [refinery]

radar:  # radar, minimap
  kind: building
  inherits: base_building
  name: Radar
  faction: union
  cost: 1000
  build_time: 42s
  hp: 1000
  sight: 10
  footprint: [2, 2]
  power: -50
  radar: true
  prerequisites: [refinery]

tech_center:  # high-tech building; prerequisite only in M3
  kind: building
  inherits: base_building
  name: Tech Center
  faction: union
  cost: 2000
  build_time: 84s
  hp: 500
  sight: 6
  footprint: [3, 3]
  power: -100
  prerequisites: [war_factory, radar]

wall:  # Wall; placed by dragging
  kind: building
  inherits: base_defense
  name: Wall
  faction: union
  cost: 100
  build_time: 4.2s
  hp: 300
  sight: 1
  armor: concrete
  footprint: [1, 1]
  wall: true
  powered: false
  prerequisites: [construction_yard]

sentry_bunker:  # light defence, machine gun
  kind: building
  inherits: base_defense
  name: Sentry Bunker
  faction: union
  cost: 500
  build_time: 21s
  hp: 400
  sight: 7
  threat: 20
  primary: sentry_machine_gun
  footprint: [1, 1]
  adjacent: 4
  prerequisites: [barracks]

tesla_coil:  # electric defence
  kind: building
  inherits: base_defense
  name: Tesla Coil
  faction: union
  cost: 1500
  build_time: 63s
  hp: 600
  sight: 8
  threat: 40
  primary: tesla_coil_bolt
  footprint: [2, 2]
  power: -75
  prerequisites: [radar]

flak_cannon:  # anti-air defence
  kind: building
  inherits: base_defense
  name: Flak Cannon
  faction: union
  cost: 1000
  build_time: 42s
  hp: 900
  sight: 5
  threat: 10
  primary: flak_cannon_gun
  footprint: [2, 2]
  power: -50
  prerequisites: [radar]
