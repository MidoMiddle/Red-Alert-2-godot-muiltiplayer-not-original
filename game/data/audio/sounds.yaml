    bus: SFX
    volume: -3
    pitch: [0.96, 1.04]
    priority: 60
    maxConcurrent: 1
    cooldownMs: 500
    positional: true
  # A building coming down, by its material (docs/map_elements/11_civilian_buildings): brick, with windows, and concrete. Which
  # building is of which is in bindings.yaml.
  snd_building_brick:
    files: [sfx/building_brick_01.wav, sfx/building_brick_02.wav]
    bus: SFX
    volume: -3
    pitch: [0.94, 1.06]
    priority: 60
    maxConcurrent: 2
    cooldownMs: 200
    positional: true
  snd_building_concrete:
