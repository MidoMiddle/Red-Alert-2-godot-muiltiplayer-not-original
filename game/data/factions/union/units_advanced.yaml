# The late units of the Union (docs/ra2_units/yaml_drafts/union, docs/content/names.md): working names of our own, numbers of the
# drafts. Unarmed for now — their weapons and abilities come with the third stage of filling the game (ability_later). Ships and the
# airship cannot be built yet (available_later): they wait for the shipyard on the water and for flight, the second stage; the airship
# and the hovercraft stand on the hover locomotor until then. Units of a single country in RA2 are the whole faction's for now.

