# The buildings of the Alliance (docs/ra2_buildings/yaml_drafts/alliance, docs/content/names.md): working names of our own, numbers
# of the drafts; see templates.yaml. Footprints the drafts left open take the size of the Union building of the same role, so a base
# fits the starts of the ready maps. An ability that needs a mechanic of M11 is marked `ability_later`: the building is built, draws
# power and opens the tech tree, and does nothing else yet.
alliance_construction_yard:  # base; comes from the MCV
  kind: building
  inherits: base_building
  name: Command Yard
  faction: alliance
  cost: 3000
  build_time: 126s
  hp: 1000
  sight: 8
  armor: concrete
  footprint: [4, 4]  # RA2 Foundation 4x4
  produces: [building, defense]

alliance_power_plant:  # power plant, +200
  kind: building
  inherits: base_building
  name: Power Station
  faction: alliance
  cost: 800
  build_time: 33.6s
  hp: 750
  sight: 4
  footprint: [2, 2]
  power: 200
  prerequisites: [alliance_construction_yard]
  spy_effect: blackout
  provides: [power]  # RA2 prerequisite group POWER

alliance_barracks:  # infantry production
  kind: building
  inherits: base_building
  name: Training Camp
  faction: alliance
  cost: 500
  build_time: 21s
  hp: 500
  sight: 5
  armor: steel
  footprint: [2, 3]  # RA2 Foundation 2x3 (OpenRA port; not confirmed)
  power: -10
  produces: [infantry]
  exit_cell: [1, 3]  # below the middle
  prerequisites: [power]
  spy_effect: veteran_infantry  # RA2: a spy makes the spy's infantry veteran (loose ends, stage 3)
  provides: [barracks]  # RA2 prerequisite group BARRACKS

alliance_ore_refinery:  # ore processing; gives a free harvester
  kind: building
  inherits: base_building
  name: Ore Processor
  faction: alliance
  cost: 2000
  build_time: 84s
  hp: 1000
  sight: 6
  footprint: [4, 3]  # RA2 Foundation 4x3 (OpenRA port; not confirmed)
  power: -50
  dock_cell: [1, 3]
  prerequisites: [power]
  spy_effect: steal_credits
  provides: [proc]  # RA2 prerequisite group PROC

alliance_war_factory:  # vehicle production
  kind: building
  inherits: base_building
  name: Vehicle Plant
  faction: alliance
  cost: 2000
  build_time: 84s
  hp: 1000
  sight: 4
  footprint: [5, 3]  # RA2 Foundation 5x3 (OpenRA port; not confirmed)
  power: -25
  produces: [vehicle]
  exit_cell: [2, 3]  # below the middle
  prerequisites: [proc, barracks]
  spy_effect: veteran_vehicles  # RA2: a spy makes the spy's vehicles veteran

alliance_air_force_command:  # radar; builds the aircraft (stage 2b)
  kind: building
  inherits: base_building
  name: Air Command
  faction: alliance
  cost: 1000
  build_time: 42s
  hp: 600
  sight: 5
  armor: steel
  footprint: [3, 2]
  power: -50
  radar: true
  produces: [aircraft]
  prerequisites: [proc]
  spy_effect: reset_map
  rearms_aircraft: true
  aircraft_docks: 4
  superweapon: paradrop  # the USA's paradrop (RA2 AmerParaDrop): 8 riflemen every 4 minutes, for the USA alone
  recharge: 240s
  paradrop: alliance_rifleman
  paradrop_count: 8
  superweapon_countries: [usa]
  provides: [radar]  # RA2 prerequisite group RADAR

alliance_naval_shipyard:  # shipyard on deep water; builds the ships (stage 2a)
  kind: building
  inherits: base_building
  name: Harbor
  faction: alliance
  cost: 1000
  build_time: 42s
  hp: 1500
  sight: 10
  armor: concrete
  footprint: [4, 4]
  power: -25
  extends_base: false
  adjacent: 12  # RA2 Adjacent=12
  water: true
  produces: [naval]
  exit_cell: [1, 4]
  prerequisites: [proc]
  capturable: false
  repairs_vehicles: true  # RA2 UnitRepair: it mends the ships beside it

alliance_service_depot:  # repairs the vehicles and ships beside it (stage 2c)
  kind: building
  inherits: base_building
  name: Repair Bay
  faction: alliance
  cost: 800
  build_time: 33.6s
  hp: 1200
  sight: 5
  footprint: [3, 3]
  power: -25
  repairs_vehicles: true
  prerequisites: [alliance_war_factory]

alliance_battle_lab:  # high tech: opens the late buildings
  kind: building
  inherits: base_building
  name: Research Lab
  faction: alliance
  cost: 2000
  build_time: 84s
  hp: 500
  sight: 6
  footprint: [3, 3]
  power: -100
  prerequisites: [alliance_war_factory, radar]
  provides: [tech]  # RA2 prerequisite group TECH
  spy_effect: steal_tech  # RA2: a spy steals its technology: the units of stolen technology open

alliance_ore_purifier:  # the ore brings 25% more (stage 2c)
  kind: building
  inherits: base_building
  name: Ore Refining Annex
  faction: alliance
  cost: 2500
  build_time: 105s
  hp: 900
  sight: 5
  footprint: [3, 3]
  power: -200
  powered: true  # RA2: the purifier works only with power
  income_bonus: 25%  # RA2 PurifierBonus, for each purifier
  prerequisites: [tech]
  capturable: false

alliance_spy_satellite_uplink:  # a radar; while ready and online, the whole map is explored (stage 2d)
  kind: building
  inherits: base_building
  category: defense  # on the Defenses tab, built by its queue (the owner's wish, 2026-10-25)
  name: Orbital Uplink
  faction: alliance
  cost: 1500
  build_time: 63s
  hp: 1000
  sight: 5
  footprint: [2, 2]
  power: -100
  powered: true
  radar: true
  reveals_map: true
  prerequisites: [tech]

alliance_chronosphere:  # superweapon: moves the vehicles and ships of 3 x 3 cells elsewhere, soldiers die; charges 7 min (stage 2d)
  kind: building
  inherits: base_building
  name: Phase Gate
  faction: alliance
  cost: 2500
  build_time: 105s
  hp: 750
  sight: 5
  armor: concrete
  footprint: [4, 3]
  power: -200
  prerequisites: [tech]
  capturable: false
  superweapon: gate
  recharge: 420s
  powered: true
  build_limit: 1
  spy_effect: reset_charge

alliance_weather_control_device:  # superweapon: a storm of lightning over an area after a delay; charges 10 min (stage 2d)
  kind: building
  inherits: base_building
  name: Storm Generator
  faction: alliance
  cost: 5000
  build_time: 210s
  hp: 1000
  sight: 5
  armor: concrete
  footprint: [3, 3]
  power: -200
  prerequisites: [tech]
  capturable: false
  superweapon: storm
  recharge: 600s
  superweapon_weapon: lightning_bolt
  powered: true
  build_limit: 1
  spy_effect: reset_charge

alliance_gap_generator:  # veils 10 cells round it from the enemy while ready and online (stage 2d)
  kind: building
  inherits: base_building
  category: defense  # RA2: on the Defenses tab, built by its queue
  name: Veil Generator
  faction: alliance
  cost: 1000
  build_time: 42s
  hp: 600
  sight: 5
  footprint: [1, 1]
  power: -100
  powered: true
  veil_radius: 10
  prerequisites: [tech]
  capturable: false

alliance_pillbox:  # light defence, machine gun
  kind: building
  inherits: base_defense
  name: Gun Nest
  faction: alliance
  cost: 500
  build_time: 21s
  hp: 400
  sight: 7
  threat: 20
  primary: alliance_pillbox_gun
  footprint: [1, 1]
  adjacent: 4
  prerequisites: [barracks]

alliance_patriot_missile_system:  # anti-air defence: fires once there are aircraft (M11b)
  kind: building
  inherits: base_defense
  name: Sky Guard
  faction: alliance
  cost: 1000
  build_time: 42s
  hp: 900
  sight: 10
  threat: 10
  primary: alliance_sky_guard_missile
  footprint: [1, 1]
  power: -50
  adjacent: 4
  prerequisites: [barracks]

alliance_prism_tower:  # beam defence; idle towers nearby add to its shot (stage 2e)
  kind: building
  inherits: base_defense
  name: Lens Tower
  faction: alliance
  cost: 1500
  build_time: 63s
  hp: 600
  sight: 8
  threat: 40
  primary: alliance_lens_beam
  chain_bonus: 150%  # RA2 PrismSupportModifier
  chain_max: 8
  footprint: [1, 1]
  power: -75
  prerequisites: [power, radar]  # RA2: POWER + RADAR

alliance_grand_cannon:  # long-range artillery defence
  kind: building
  inherits: base_defense
  name: Siege Battery
  faction: alliance
  cost: 2000
  build_time: 84s
  hp: 900
  sight: 10
  threat: 45
  primary: alliance_siege_shell
  footprint: [2, 2]
  power: -100
  prerequisites: [radar]
  countries: [france]  # RA2 RequiredHouses (loose ends, stage 5)

alliance_wall:  # wall; placed by dragging
  kind: building
  inherits: base_defense
  name: Barrier
  faction: alliance
  cost: 100
  build_time: 4.2s
  hp: 300
  sight: 1
  armor: concrete
  footprint: [1, 1]
  wall: true
  powered: false
  adjacent: 8
  prerequisites: [barracks]
