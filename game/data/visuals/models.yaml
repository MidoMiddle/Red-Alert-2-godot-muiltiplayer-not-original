# The table of models (docs/art/model_standards.md): what in the game has a model, its file under game/assets/models/ and how it
# sits. An object not here — or whose file is missing — is drawn with its placeholder, as before.
#
# Keys:
#   building/<id>   a building of the players (game/data/factions) or of the map (neutral_*, tech_*): pivot at the centre of the
#                   footprint on the ground; its team_mask node takes the owner's colour
#   unit/<id>       a unit (game/data/factions): pivot at the centre on the ground, front to -Z; a turret node turns on its own
#   object/<id>     a map object (pine_tree is drawn as a tree/<shape>): pivot at the centre of the cell on the ground
#   tree/<shape>    a tree of a climate: pine (snow), broadleaf_small and broadleaf_big (temperate, urban), palm and cactus (desert);
#                   the holo tank's disguise too
#   ore/<kind>      the clusters of a field: ore and gems (the file only: the field scales and turns them)
#   crate/supply    a crate of a match (M11 a6): pivot at the centre of its cell on the ground
# Fields: file — or files: [a list of kinds of it], each cell picks one — (one of the two is required), scale (1), yaw in degrees
# (0), offset [x, y, z] in cells ([0, 0, 0]), jitter — the share the size of each varies either way, 0…0.5 (0), spin — each turned
# any way (false), height in cells for the bars over a building (its look's when 0), climates — the climates it is drawn in (all
# when left out). The pick goes by the cell: the same tree is the same cactus every time, neighbours differ.
# damaged, damaged_occupied, occupied, abandoned, ruins — a building's file in its states: damaged (a quarter to a half of its hit
# points), with soldiers inside (damaged_occupied for a damaged one, occupied for a whole one), abandoned (under a quarter: its soldiers
# come out, the file of the critically damaged one) and fallen (the ruins stay on its footprint); without one, the file above is drawn.
# Its nodes fire_1, fire_2… stand the flames of an abandoned one.
format: models/1
models:
  # The crates of a match (M11 a6): the supply crate of the map's props.
  crate/supply:               { file: map/prop_supply_crate/prop_supply_crate.glb }

  # The buildings of the players (docs/ra2_buildings). The team_mask nodes take the owner's colour.
  building/tesla_coil: { file: building/tesla_coil/tesla_coil.glb, height: 3 }
  building/barracks:   { file: building/barracks/barracks.glb, height: 3.6 }
  building/alliance_barracks: { file: building/alliance_barracks/alliance_barracks.glb, height: 2.5 }
  building/war_factory: { file: building/war_factory/war_factory.glb, height: 2.6 }
  building/alliance_war_factory: { file: building/alliance_war_factory/alliance_war_factory.glb, height: 1.8 }
  building/alliance_power_plant: { file: building/alliance_power_plant/alliance_power_plant.glb, height: 2 }
  building/reactor:    { file: building/reactor/reactor.glb, height: 1.6 }
  building/alliance_air_force_command: { file: building/alliance_air_force_command/alliance_air_force_command.glb, height: 2 }
  building/radar:      { file: building/radar/radar.glb, height: 2.1 }
  building/tech_center: { file: building/tech_center/tech_center.glb, height: 2.7 }
  building/alliance_battle_lab: { file: building/alliance_battle_lab/alliance_battle_lab.glb, height: 3.1 }
  building/alliance_service_depot: { file: building/alliance_service_depot/alliance_service_depot.glb, height: 1.1 }
  building/alliance_ore_purifier: { file: building/alliance_ore_purifier/alliance_ore_purifier.glb, height: 1.8 }
  building/service_depot: { file: building/service_depot/service_depot.glb, height: 2.4 }
  building/nuclear_reactor: { file: building/nuclear_reactor/nuclear_reactor.glb, height: 1.6 }
  building/alliance_construction_yard: { file: building/alliance_construction_yard/alliance_construction_yard.glb, height: 1.6 }
  building/construction_yard: { file: building/construction_yard/construction_yard.glb, height: 2.2 }
  building/alliance_naval_shipyard: { file: building/alliance_naval_shipyard/alliance_naval_shipyard.glb, height: 2.1 }
  building/naval_shipyard: { file: building/naval_shipyard/naval_shipyard.glb, height: 2.3 }
  building/nuclear_missile_silo: { file: building/nuclear_missile_silo/nuclear_missile_silo.glb, height: 2.3 }
  building/alliance_weather_control_device: { file: building/alliance_weather_control_device/alliance_weather_control_device.glb, height: 2.4 }
  building/alliance_chronosphere: { file: building/alliance_chronosphere/alliance_chronosphere.glb, height: 1.3 }
  building/iron_curtain: { file: building/iron_curtain/iron_curtain.glb, height: 1.75 }
  building/alliance_pillbox: { file: building/alliance_pillbox/alliance_pillbox.glb, height: 0.5 }
  building/sentry_bunker: { file: building/sentry_bunker/sentry_bunker.glb, height: 0.7 }
  building/wall:       { file: building/wall/wall.glb, height: 0.7 }
  building/alliance_wall: { file: building/alliance_wall/alliance_wall.glb, height: 0.65 }
  building/alliance_prism_tower: { file: building/alliance_prism_tower/alliance_prism_tower.glb, height: 2 }
  building/alliance_patriot_missile_system: { file: building/alliance_patriot_missile_system/alliance_patriot_missile_system.glb, height: 0.75 }
  building/alliance_spy_satellite_uplink: { file: building/alliance_spy_satellite_uplink/alliance_spy_satellite_uplink.glb, height: 1.5 }
  building/flak_cannon: { file: building/flak_cannon/flak_cannon.glb, height: 1 }
  building/alliance_gap_generator: { file: building/alliance_gap_generator/alliance_gap_generator.glb, height: 1.55 }

  # The civilian and industrial buildings of the map are low, as RA2's: a storey about 0.25 cells, a soldier 0.6 (measured against RA2,
  # 2026-10-26). Their models were made a storey to a cell: height_scale 0.35 squashes them upright, their footprints the same.
  # The civilian houses of the map (docs/map_elements/11_civilian_buildings): whole, damaged, abandoned (critically damaged, its soldiers
  # out) and ruins once it has fallen; with soldiers inside, the whole one (occupied) and the damaged one (damaged_occupied).
  building/neutral_house_a: { file: map/building_house_small/building_house_small.glb, height: 0.88, height_scale: 0.35,
                              damaged: map/building_house_small_damaged/building_house_small_damaged.glb,
                              damaged_occupied: map/building_house_small_damaged_occupied/building_house_small_damaged_occupied.glb,
                              occupied: map/building_house_small_occupied/building_house_small_occupied.glb,
                              abandoned: map/building_house_small_abandoned/building_house_small_abandoned.glb,
                              ruins: map/building_house_ruins/building_house_ruins.glb }

  # The apartment block of the map (docs/map_elements/11_civilian_buildings): the same states as the house.
  building/neutral_apartment: { file: map/building_apartment_block/building_apartment_block.glb, height: 2.1, height_scale: 0.35,
                                damaged: map/building_apartment_block_damaged/building_apartment_block_damaged.glb,
                                damaged_occupied: map/building_apartment_block_damaged_occupied/building_apartment_block_damaged_occupied.glb,
                                occupied: map/building_apartment_block_occupied/building_apartment_block_occupied.glb,
                                abandoned: map/building_apartment_block_abandoned/building_apartment_block_abandoned.glb,
                                ruins: map/building_apartment_block_ruins/building_apartment_block_ruins.glb }

  # The oil pumpjack of the map (docs/map_elements/12_tech_buildings): the beam nods while it works, the ring on the tank takes the
  # owner's colour, and its ruins stay where it fell.
  building/tech_oil_derrick: { file: map/tech_oil_derrick/tech_oil_derrick.glb, height: 2.2,
                               abandoned: map/tech_oil_derrick_abandoned/tech_oil_derrick_abandoned.glb,
                               ruins: map/tech_oil_derrick_ruins/tech_oil_derrick_ruins.glb }

  # The industrial buildings of the map (docs/industrial_elements).
  building/neutral_smokestack:     { file: industrial/smokestack/smokestack.glb, height: 2.1, height_scale: 0.35 }
  building/neutral_cooling_tower:  { file: industrial/cooling_tower/cooling_tower.glb, height: 1.75, height_scale: 0.35 }
  building/neutral_factory_hall:   { file: industrial/factory_hall/factory_hall.glb, height: 1.75, height_scale: 0.35 }
  building/neutral_boiler_house:   { file: industrial/boiler_house/boiler_house.glb, height: 1.22, height_scale: 0.35 }
  building/neutral_fuel_tank:      { file: industrial/fuel_tank/fuel_tank.glb, height: 0.88, height_scale: 0.35 }

  # Map objects (docs/map_elements, docs/obstacle_elements). A fence and a pipe run along x, as their placeholders.
  object/ore_source:          { file: map/ore_source/ore_source.glb }
  object/fence_wood:          { file: map/fence_wood_section/fence_wood_section.glb }
  object/pipeline:            { file: industrial/pipeline_straight/pipeline_straight.glb }
  object/anti_tank_hedgehog:  { file: obstacle/anti_tank_hedgehog/obstacle_anti_tank_hedgehog.glb }
  object/snowdrift:           { files: [map/snowdrift_01/snowdrift_01.glb, map/snowdrift_02/snowdrift_02.glb], jitter: 0.2, spin: true,
                                climates: [winter] }

  # The ore fields.
  ore/ore:   { file: map/ore_cluster/ore_cluster.glb }
  ore/gems:  { file: map/gem_cluster/gem_cluster.glb }

  # The units of the players (docs/ra2_units). The turret node turns, the team_mask nodes take the owner's colour.
  # Made at the standard before 2026-10-26 (a tank 0.8 cells long): shown 1.4 times bigger, as RA2's.
  unit/alliance_light_tank:  { file: unit/alliance_light_tank/alliance_light_tank.glb, scale: 1.4 }
  unit/alliance_harvester:   { file: unit/alliance_harvester/alliance_harvester.glb, scale: 1.4 }
  unit/harvester:            { file: unit/harvester/harvester.glb, scale: 1.4 }
