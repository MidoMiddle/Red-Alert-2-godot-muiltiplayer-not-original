# Черновик записей набора map (docs/map_elements). Игра эти файлы не читает: см. docs/elements_data/README.md.
# Значения из кода совпадают с src/Rts.Simulation/Map/MapObjectTypes.cs, World/BuildingTypes.cs, Map/Bridge.cs.
# «в документе не задано» — значения нет в документе. Если оно есть в коде, ключ взят из кода (помечено «из кода»).

# 07_trees
pine_tree:
  kind: map_object
  hp: 400 # в документе не задано; из кода (класс «средняя»)
  blocks: all # документ: блокирует всех наземных
  crushed_by: [] # из кода; давка деревьев — открытый вопрос (документ 07, вопрос 2)
  stump: true # документ: после разрушения остаётся пень
  burns: true # документ: горит (M11); признака горения в коде нет
  # в документе не задано: explodes

# 08_fences_walls
fence_wood:
  kind: map_object
  hp: 150 # в документе не задано; из кода. Класса README с таким значением нет (50, 400, 1500)
  blocks: [foot, wheel, amphibious, naval, hover] # документ: пехота и колёса; амфибии, флот, ховер — из кода, в документе не заданы
  crushed_by: [track] # документ: давится гусеницами
  stump: false # в документе не задано; из кода
  # в документе не задано: explodes, burns

wall_stone:
  kind: map_object
  hp: 1500 # в документе не задано; из кода (класс «высокая»)
  blocks: all # документ: блокирует всех наземных
  crushed_by: [] # документ: разрушается только оружием; из кода
  stump: false # в документе не задано; из кода
  # в документе не задано: explodes, burns

# 09_props
boulder:
  kind: map_object
  hp: 0 # документ: неразрушаемый; из кода
  blocks: all # документ: блокирует всех наземных
  crushed_by: [] # в документе не задано; из кода
  stump: false # в документе не задано; из кода
  # в документе не задано: explodes, burns

lamp_post:
  kind: map_object
  hp: 50 # в документе не задано; из кода (класс «низкая»)
  blocks: [] # документ: не блокирует
  crushed_by: all # документ: давится всеми
  stump: false # в документе не задано; из кода
  # в документе не задано: explodes, burns. Свет фонаря (документ 18) в схеме ключа нет

# 05_bridges
bridge_wood_low:
  kind: bridge
  segment_hp: 600 # в документе не задано; из кода (ориентир до баланса M4)

# 20_snowdrift
snowdrift:
  kind: map_object
  hp: 0 # документ: прочность не применяется, неразрушим; из кода
  blocks: [] # документ: проходу не мешает
  crushed_by: [track] # документ: гусеницы сминают
  speed: # документ: пехота ×0,6, гусеницы ×0,8, колёса ×0,5
    foot: 60
    track: 80
    wheel: 50
  stump: false # в документе не задано; из кода
  burns: false # документ: не горит
  # в документе не задано: explodes; ховер и амфибия (открытый вопрос документа 20)

