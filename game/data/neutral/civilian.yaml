# The neutral buildings of maps (docs/implementation/M3_base_economy.md, step 14a; M7, 4.8): the winter and industrial sets and the
# town, beach, desert, harbour and farm buildings of the element documents (docs/city_elements … docs/temperate_elements). The engine
# knows each by its id (src/Rts.Simulation/World/BuildingTypes.cs). Hit points by the class of the document (low ≈ 300, medium ≈ 800,
# high ≈ 1500 and more), a rough guide until the balance.
#
# The soldiers a civilian building holds go by its size, from 3 in a hut to 12 in the biggest (the owner's wish, 2026-10-26; RA2's
# MaxNumberOccupants runs about so): a 2 x 2 footprint holds 3, a 2 x 3 or 3 x 2 one 6, 3 x 3 and more 12; a stone building of
# several storeys (1500 hit points and more) one step of 3 up, the skyscraper (2500) the most. No engineer takes them.

