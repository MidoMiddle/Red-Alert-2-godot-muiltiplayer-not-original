# The first units of the Alliance (docs/ra2_units/yaml_drafts/alliance, docs/content/names.md): its MCV and harvester, which a faction
# needs, an infantry and a tank. The rest of the army comes with M11c. The templates' prerequisites are the Union's, so every unit
# sets its own.
alliance_rifleman:  # rifle infantry
  kind: unit
  inherits: base_infantry
  name: Rifleman
  faction: alliance
  cost: 200
  build_time: 8.4s
  hp: 125
  threat: 10
  armor: none  # RA2 GI: none (the Conscript is flak)
  primary: alliance_rifle
  deployed_weapon: alliance_rifle_deployed  # D: behind sandbags, RA2 Deployer; the sandbags give no armor (RA2)
  sight: 5
  prerequisites: [alliance_barracks]
  ifv_weapon: ifv_machine_gun
  occupier: true  # RA2 Occupier: it may garrison a civilian building
  occupy_weapon: allied_occupy_gun  # what it fires from inside (RA2)

alliance_mcv:  # deploys into the Command Yard
  kind: unit
  inherits: base_vehicle
  name: Mobile Command Unit
  faction: alliance
  cost: 3000
  build_time: 126s
  hp: 1000
  threat: 5
  speed: 24
  sight: 6
  turret: false
  prerequisites: [alliance_war_factory, alliance_service_depot]  # RA2: GAWEAP + GADEPT
  size: 6

alliance_harvester:  # the refinery's free harvester
  kind: unit
  inherits: base_vehicle
  name: Ore Hauler
  faction: alliance
  cost: 1400
  build_time: 58.8s
  hp: 1000
  threat: 5
  armor: medium
  speed: 24
  sight: 4
  turret: false
  # As the Union's: 1000 credits of ore, a stage in 0.8 s, 50 credits a tick unloaded. Unarmed.
  harvest_capacity: 1000
  harvest_time: 0.8s
  unload_rate: 50
  prerequisites: [alliance_war_factory, alliance_ore_refinery]
  psionic_immune: true  # RA2 ImmuneToPsionics: no mind control takes it
  teleports_home: true  # RA2 Teleporter=yes: full, or sent home, it jumps to the refinery and phases in; it drives to the ore
  self_heal: 1  # RA2 SelfHealing=yes
  radiation_immune: true  # RA2 ImmuneToRadiation=yes
  trainable: false  # RA2 Trainable=no

alliance_light_tank:  # battle tank: quicker and lighter than the Union's heavy tank
  kind: unit
  inherits: base_vehicle
  name: Light Tank
  faction: alliance
  cost: 700
  build_time: 29.4s
  hp: 300
  threat: 25
  primary: alliance_light_cannon
  speed: 42
  sight: 8
  prerequisites: [alliance_war_factory]
