# The weapons of the late buildings of the Union (stage 2c of filling the game; docs/content/names.md).
atomic_plant_blast:  # what the atomic plant leaves when a shot brings it down (death_weapon)
  kind: weapon
  name: Atomic Blast
  damage: 600
  reload: 1s
  range: 1
  projectile: shell
  warhead: atomic_blast

shock_bolt:  # of the Shock Infantry, RA2 ElectricBolt
  kind: weapon
  name: Shock Bolt
  damage: 50
  reload: 4s
  range: 3
  projectile: bolt
  warhead: electric

toxin_beam_gun:  # of the Toxin Trooper, RA2 RadBeamWeapon
  kind: weapon
  name: Toxin Beam
  damage: 125
  reload: 3.33s
  range: 6
  projectile: toxin_beam
  warhead: toxin

war_hound_bite:  # of the War Hound, RA2 BadTeeth: 1000 so that the bite kills any soldier, as the parasite warhead of RA2 does
  kind: weapon
  name: Bite
  damage: 1000
  reload: 2s
  range: 1.5
  projectile: pounce
  warhead: bite

ivan_bomber:  # of the Bomb Specialist, RA2 IvanBomber: plants the bomb at hand's reach; the reload is ours
  kind: weapon
  name: Bomb
  damage: 1
  reload: 2s
  range: 1.5
  projectile: pounce
  warhead: ivan_bomb_plant

ivan_bomb_blast:  # Ivan's bomb going off, RA2 IvanDamage
  kind: weapon
  name: Ivan Bomb
  damage: 400
  reload: 1s
  range: 1
  projectile: shell
  warhead: ivan_blast

terror_bomb:  # of the Demolition Trooper, RA2 TerrorBomb: firing it, it blows up (suicide), and it does so when killed (death_weapon)
  kind: weapon
  name: Terror Bomb
  damage: 225
  reload: 1s
  range: 1.5
  projectile: shell
  warhead: terror_blast
  suicide: true

toxin_eruption_gun:  # the deployed Toxin Trooper, RA2 RadEruptionWeapon: at its own cell every 60 frames
  kind: weapon
  name: Toxin Eruption
  damage: 0
  reload: 4s
  range: 1
  projectile: bullet
  warhead: toxin_eruption

toxin_ground:  # the toxin on the ground; its damage is the level of the cell (RadiationSystem)
  kind: weapon
  name: Toxin
  damage: 0
  reload: 1s
  range: 1
  projectile: bullet
  warhead: toxin_site

apocalypse_cannons:  # of the Super Heavy Tank, RA2 120mmx: two shells of 100, ROF 80
  kind: weapon
  name: Twin 120mm Cannons
  damage: 100
  reload: 5.33s
  range: 5.75
  projectile: shell
  warhead: apoc_ap
  burst: 2
  burst_delay: 0.2s

apocalypse_tusks:  # of the Super Heavy Tank, RA2 MammothTusk: two missiles of 50 at the air only
  kind: weapon
  name: Mammoth Tusk Missiles
  damage: 50
  reload: 5.33s
  range: 8
  projectile: rocket
  warhead: flak_air
  burst: 2
  burst_delay: 0.2s
  targets: [air]

v3_rocket:  # of the Rocket Artillery, RA2 V3: 200 at 5 to 18 cells; the reload is ours
  kind: weapon
  name: V3 Rocket
  damage: 200
  reload: 10s
  range: 18
  min_range: 5
  projectile: v3_shot
  warhead: v3_blast
