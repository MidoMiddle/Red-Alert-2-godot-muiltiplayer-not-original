# The units of the Union (docs/implementation/M3_base_economy.md, 4.6). RA2 counterpart in brackets; see templates.yaml for units.
conscript:  # Conscript
  kind: unit
  inherits: base_infantry
  name: Conscript
  faction: union
  cost: 100
  build_time: 4.2s
  hp: 125
  threat: 10
  armor: flak
  primary: conscript_rifle
  sight: 5
  ifv_weapon: ifv_machine_gun
  occupier: true  # RA2 Occupier: it may garrison a civilian building
  occupy_weapon: soviet_occupy_gun  # what it fires from inside (RA2)

rocketeer:  # Flak Trooper
  kind: unit
  inherits: base_infantry
  name: Rocket Trooper
  faction: union
  cost: 300
  build_time: 12.6s
  hp: 100
  threat: 15
  primary: rocketeer_rocket
  sight: 5

engineer:  # Engineer: takes a building of the enemy, mends its own (stage 3b)
  kind: unit
  inherits: base_infantry
  name: Engineer
  faction: union
  cost: 500
  build_time: 21s
  hp: 75
  threat: 5
  sight: 4
  engineer: true
  ifv_weapon: ifv_repair_arm
  trainable: false  # RA2 Trainable=no (loose ends, stage 3)

mcv:  # MCV
  kind: unit
  inherits: base_vehicle
  name: MCV
  faction: union
  cost: 3000
  build_time: 126s
  hp: 1000
  threat: 5
  speed: 24
  sight: 6
  turret: false
  prerequisites: [war_factory, service_depot]  # RA2: NAWEAP + NADEPT
  size: 6

harvester:  # War Miner
  kind: unit
  inherits: base_vehicle
  name: War Harvester
  faction: union
  cost: 1400
  build_time: 58.8s
  hp: 1000
  threat: 5
  armor: medium
  primary: harvester_machine_gun
  speed: 24
  sight: 4
  # Carries 1000 credits of ore (40 stages), takes a stage in 0.8 s and unloads 50 credits a tick.
  harvest_capacity: 1000
  harvest_time: 0.8s
  unload_rate: 50
  prerequisites: [war_factory, refinery]
  psionic_immune: true  # RA2 ImmuneToPsionics: no mind control takes it

support_vehicle:  # Flak Track
  kind: unit
  inherits: base_vehicle
  name: Flak Track
  faction: union
  cost: 500
  build_time: 21s
  hp: 180
  threat: 15
  primary: flak_track_gun
  secondary: flak_track_aa_gun
  locomotor: wheel
  speed: 48
  sight: 8

heavy_tank:  # Rhino Tank
  kind: unit
  inherits: base_vehicle
  name: Heavy Tank
  faction: union
  cost: 900
  build_time: 37.8s
  hp: 400
  threat: 30
  primary: heavy_tank_cannon
  speed: 36
  sight: 8

tesla_tank:  # Tesla Tank
  kind: unit
  inherits: base_vehicle
  name: Tesla Tank
  faction: union
  cost: 1200
  build_time: 50.4s
  hp: 300
  threat: 35
  primary: tesla_tank_bolt
  speed: 36
  sight: 8
  prerequisites: [war_factory, tech_center]
  countries: [russia]  # RA2 RequiredHouses (loose ends, stage 5)
