# Морской набор: черновик записей (docs/naval_elements). Игра этот файл не читает.
# Статусы и пункты владельца: docs/elements_data/README.md. Элементы и статусы: index/naval.md.
# Без записи: 01 Мель (тип земли shallow уже в коде) и 09 Причальная стенка (обрыв, рельеф уже в коде).
# У зданий blocks не пишется: блокирует футпринт (как в примере README).
# Прочность по классам: объект карты низкая 50, средняя 400, высокая 1500; здание низкая 300, средняя 800, высокая 1500.

# 02 Подводный риф. Предложение (в коде нет). Статус: ждёт M11b, ждёт M11e (климат beach).
reef:
  kind: map_object
  hp: 1500  # высокая: камень
  blocks: [naval, amphibious]
  crushed_by: []
  # hover не задан: открытый вопрос набора (naval README, вопрос 6)

# 03 Льдина. Предложение (в коде нет). Статус: ждёт M11b. Климат winter уже в игре.
ice_floe:
  kind: map_object
  hp: 400  # средняя
  blocks: [naval]  # амфибия не блокируется: предложение документа
  crushed_by: []
  # дрейф и разлом льдины: открытые вопросы документа

# 04 Морская нефтяная платформа. Предложение (в коде нет). Статус: ждёт M11a, ждёт M11b, ждёт решения 4.
offshore_platform:
  kind: neutral_building
  footprint: [2, 2]
  hp: 1500  # высокая: металл
  garrison: 0
  capturable: true  # захват с воды, инженер с палубы: предложение документа
  burns: false
  # блокирует флот и амфибий футпринтом на воде
  # доход: пункт 4, как у нефтевышки; ключа дохода в схеме нет

# 05 Портовый кран. Предложение (в коде нет). Статус: ждёт M11b, ждёт M11e (климат beach).
port_crane:
  kind: map_object
  hp: 1500  # высокая: металл
  blocks: all  # всех наземных (документ не уточняет); основание, одна клетка; стрела не блокирует
  crushed_by: []
  burns: false

# 06 Контейнерные штабеля. Предложение (в коде нет). Статус: ждёт M11b, ждёт M11e (климат beach).
container_stack:
  kind: map_object
  hp: 1500  # высокая: металл
  blocks: all  # всех наземных; флот на суше не ходит
  crushed_by: []
  burns: false
  # документ: 2x1 клетки; footprint в схеме только у зданий

# 07 Портовый склад. Предложение (в коде нет). Статус: ждёт M11a, ждёт M11b.
port_warehouse:
  kind: neutral_building
  footprint: [3, 3]
  hp: 800  # средняя: металл
  garrison: 4  # предварительно: документ дает 4 или 6 (вопрос 1); в пункте 3 README этого склада нет
  capturable: false
  burns: false
  # блокирует всех наземных футпринтом

# 08 Гражданские суда (паром, грузовое судно, рыбацкая лодка): нейтральная техника, записей нет, см. index/naval.md
