# The kinds of map objects (docs/implementation/M3_base_economy.md, step 14a; docs/formats/rtsmap.md, section 4). The engine knows
# each by its id (src/Rts.Simulation/Map/MapObjectTypes.cs), and its number is part of the rules: a new kind needs both.
# `blocks` — the locomotors it stops; `hp` — 0 when nothing destroys it; `crushed_by` — the locomotors that drive over it and
# flatten it; `stump` — a tree that leaves a stump; `speed` — the speed it gives a locomotor on its cell (100% when not named).
# Hit points are a rough guide: the RA2 numbers for map objects are not confirmed in our documents.

pine_tree:
  kind: map_object
  name: Pine tree
  blocks: [amphibious, foot, hover, naval, track, wheel]
  hp: 400
  stump: true

boulder:
  kind: map_object
  name: Boulder
  blocks: [amphibious, foot, hover, naval, track, wheel]

# A fence stops infantry and wheels (and the other light movers); tracks drive through and flatten it.
fence_wood:
  kind: map_object
  name: Wooden fence
  blocks: [amphibious, foot, hover, naval, wheel]
  hp: 150
  crushed_by: [track]

wall_stone:
  kind: map_object
  name: Stone wall
  blocks: [amphibious, foot, hover, naval, track, wheel]
  hp: 1500

lamp_post:
  kind: map_object
  name: Lamp post
  hp: 50
  crushed_by: [amphibious, foot, hover, naval, track, wheel]

anti_tank_hedgehog:
  kind: map_object
  name: Anti-tank hedgehog
  blocks: [track, wheel]
  hp: 400

pipeline:
  kind: map_object
  name: Pipeline
  blocks: [track, wheel]
  hp: 50

# A snowdrift slows foot, tracks and wheels; the rest drive at full speed (docs/map_elements/20_snowdrift).
snowdrift:
  kind: map_object
  name: Snowdrift
  crushed_by: [track]
  speed: { foot: 60%, track: 80%, wheel: 50% }

# The drill towers of ore and gem fields (M3 step 16): in everyone's way, never destroyed; they erupt ore or gems.
ore_source:
  kind: map_object
  name: Ore drill
  blocks: [amphibious, foot, hover, naval, track, wheel]

gem_source:
  kind: map_object
  name: Gem drill
  blocks: [amphibious, foot, hover, naval, track, wheel]

