# The late buildings of the Union (docs/ra2_buildings/yaml_drafts/union, docs/content/names.md): working names of our own. Built,
# drawing power and opening the tech tree now; an ability that needs a mechanic of M11 is marked `ability_later` and does nothing
# yet — the projector and the silo fire nothing, the workshop repairs nothing. The shipyard stands on deep water and builds the ships
# (stage 2a).
naval_shipyard:  # shipyard on deep water; builds the ships (stage 2a)
  kind: building
  inherits: base_building
  name: Dockyard
  faction: union
  cost: 1000
  build_time: 42s
  hp: 1500
  sight: 10
  armor: concrete
  footprint: [4, 4]
  power: -20
  extends_base: false
  adjacent: 10
  water: true
  produces: [naval]
  exit_cell: [1, 4]
  prerequisites: [refinery]

service_depot:  # repairs the vehicles and ships beside it (stage 2c)
  kind: building
  inherits: base_building
  name: Field Workshop
  faction: union
  cost: 800
  build_time: 33.6s
  hp: 1200
  sight: 5
  footprint: [3, 3]
  power: -20
  repairs_vehicles: true
  prerequisites: [war_factory]

nuclear_reactor:  # late power, +2000; blows up when a shot brings it down (stage 2c)
  kind: building
  inherits: base_building
  name: Atomic Plant
  faction: union
  cost: 1000
  build_time: 42s
  hp: 1000
  sight: 5
  armor: concrete
  footprint: [4, 4]
  power: 2000
  death_weapon: atomic_plant_blast
  prerequisites: [tech_center]

iron_curtain:  # superweapon: a group made invulnerable for a while, M11a
