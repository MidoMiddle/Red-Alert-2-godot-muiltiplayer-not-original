# Warheads (docs/implementation/M4_combat.md, 4.1, 4.3): what a hit does. `verses` gives the share of the weapon's damage against
# every armor type (all of them must be listed, 0% to 1000%); `spread` is the radius of the area in cells and `percent_at_max` the
# share at its edge. Starting numbers follow the RA2 warheads named in the comments (docs/ra2_units, docs/ra2_buildings); the balance
# comes in M4 step 14.
small_arms:  # RA2 SA: rifles and machine guns, strong against infantry
  kind: warhead
  name: Small Arms
  verses: { none: 100%, flak: 80%, plate: 80%, light: 50%, medium: 25%, heavy: 25%, wood: 75%, steel: 50%, concrete: 25%, special_1: 100%, special_2: 100% }
  infantry_death: normal

ap_shell:  # RA2 AP: tank shells, strong against vehicles
  kind: warhead
  name: Armor Piercing
  verses: { none: 25%, flak: 25%, plate: 25%, light: 75%, medium: 100%, heavy: 100%, wood: 65%, steel: 45%, concrete: 45%, special_1: 100%, special_2: 100% }
  spread: 0.3
  percent_at_max: 50%
  wall_damage: true
  infantry_death: explode

electric:  # RA2 Electric: Tesla bolts, good against everything, half against buildings
  kind: warhead
  name: Electric
  verses: { none: 100%, flak: 100%, plate: 100%, light: 85%, medium: 100%, heavy: 100%, wood: 50%, steel: 50%, concrete: 50%, special_1: 100%, special_2: 100% }
  infantry_death: electro

flak_ground:  # RA2 FlakTWH: flak at the ground, in an area, strong against infantry
  kind: warhead
  name: Flak (ground)
  verses: { none: 150%, flak: 100%, plate: 50%, light: 60%, medium: 10%, heavy: 10%, wood: 30%, steel: 10%, concrete: 10%, special_1: 100%, special_2: 100% }
  spread: 1
  percent_at_max: 25%
  infantry_death: explode

flak_air:  # RA2 FlakWH: flak at aircraft, nothing against buildings
  kind: warhead
  name: Flak (air)
  verses: { none: 100%, flak: 100%, plate: 100%, light: 100%, medium: 20%, heavy: 20%, wood: 0%, steel: 0%, concrete: 0%, special_1: 100%, special_2: 100% }
  spread: 1
  percent_at_max: 10%
  affects_air: true

light_mg:  # RA2 20mmRapid: the harvester's machine gun
  kind: warhead
  name: Light Machine Gun
  verses: { none: 100%, flak: 80%, plate: 70%, light: 50%, medium: 20%, heavy: 20%, wood: 20%, steel: 10%, concrete: 10%, special_1: 100%, special_2: 100% }
  infantry_death: normal

missile:  # the anti-tank rocket of the Rocket Trooper (M4 plan, 4.18)
  kind: warhead
  name: Missile
  verses: { none: 25%, flak: 25%, plate: 25%, light: 75%, medium: 100%, heavy: 100%, wood: 50%, steel: 50%, concrete: 25%, special_1: 100%, special_2: 100% }
  spread: 0.3
  percent_at_max: 50%
  infantry_death: explode

atomic_blast:  # RA2 NUKE of the nuclear reactor when it falls (stage 2c): everything around, buildings and walls too
  kind: warhead
  name: Atomic Blast
  verses: { none: 100%, flak: 100%, plate: 100%, light: 100%, medium: 100%, heavy: 100%, wood: 100%, steel: 100%, concrete: 100%, special_1: 100%, special_2: 100% }
  spread: 5
  percent_at_max: 25%
  wall_damage: true
  infantry_death: explode

hollow_point:  # RA2 HollowPoint: the pistols of the Elite Commando and the rifle of the Marksman; one shot kills a soldier, vehicles and buildings shrug it off
  kind: warhead
  name: Hollow Point
  verses: { none: 200%, flak: 100%, plate: 100%, light: 1%, medium: 1%, heavy: 1%, wood: 1%, steel: 1%, concrete: 1%, special_1: 100%, special_2: 100% }
  infantry_death: normal

toxin:  # RA2 RadBeamWarhead: melts soldiers, hardly scratches vehicles, nothing to buildings
  kind: warhead
  name: Toxin
  verses: { none: 100%, flak: 100%, plate: 100%, light: 20%, medium: 15%, heavy: 10%, wood: 0%, steel: 0%, concrete: 0%, special_1: 100%, special_2: 100% }
  infantry_death: electro

bite:  # RA2 ParasiteDog: a dog's bite kills any soldier, does nothing to vehicles and buildings (the damage of the bite is set to kill)
  kind: warhead
  name: Bite
  verses: { none: 100%, flak: 100%, plate: 100%, light: 0%, medium: 0%, heavy: 0%, wood: 0%, steel: 0%, concrete: 0%, special_1: 0%, special_2: 0% }
  infantry_death: normal

jetpack_rounds:  # RA2 SSA: the 20mm guns of the Jetpack Trooper; wood and steel are ours (RA2 gives no number)
  kind: warhead
  name: Jetpack Rounds
  verses: { none: 100%, flak: 100%, plate: 70%, light: 60%, medium: 40%, heavy: 40%, wood: 25%, steel: 25%, concrete: 25%, special_1: 100%, special_2: 100% }
  infantry_death: normal

chrono:  # RA2 ChronoBeam: hurts nothing, erases the target from time (temporal)
  kind: warhead
  name: Chrono Beam
  verses: { none: 100%, flak: 100%, plate: 100%, light: 100%, medium: 100%, heavy: 100%, wood: 100%, steel: 100%, concrete: 100%, special_1: 100%, special_2: 100% }
  temporal: true
  infantry_death: electro

ivan_bomb_plant:  # RA2 IvanBomb: Ivan's bomb is put on the target, not into it (stage 3b); it goes off in 450 frames
  kind: warhead
  name: Ivan Bomb
  verses: { none: 100%, flak: 100%, plate: 100%, light: 100%, medium: 100%, heavy: 100%, wood: 100%, steel: 100%, concrete: 100%, special_1: 100%, special_2: 100% }
  bomb: ivan_bomb_blast
  bomb_delay: 30s

ivan_blast:  # RA2 IvanWH: the blast of Ivan's bomb
  kind: warhead
  name: Ivan Blast
  verses: { none: 100%, flak: 100%, plate: 100%, light: 100%, medium: 100%, heavy: 100%, wood: 100%, steel: 250%, concrete: 20%, special_1: 100%, special_2: 100% }
  spread: 1.5
  infantry_death: explode

terror_blast:  # RA2 TerrorBombWH: the demolition trooper going off
  kind: warhead
  name: Terror Blast
  verses: { none: 150%, flak: 100%, plate: 100%, light: 90%, medium: 50%, heavy: 50%, wood: 100%, steel: 150%, concrete: 30%, special_1: 100%, special_2: 100% }
  spread: 2
  percent_at_max: 50%
  infantry_death: explode

c4_plant:  # RA2 Sapper: the commando's C4 on a building (stage 3b); RA2 C4Delay is .03 minutes
  kind: warhead
  name: C4
  verses: { none: 0%, flak: 0%, plate: 0%, light: 0%, medium: 0%, heavy: 0%, wood: 100%, steel: 100%, concrete: 100%, special_1: 0%, special_2: 0% }
  bomb: alliance_c4_charge
  bomb_delay: 1.8s

demolition:  # what the C4 does to the building it is on: brings it down whatever its strength
  kind: warhead
  name: Demolition
  verses: { none: 100%, flak: 100%, plate: 100%, light: 100%, medium: 100%, heavy: 100%, wood: 100%, steel: 100%, concrete: 100%, special_1: 100%, special_2: 100% }
  infantry_death: explode

toxin_eruption:  # RA2 RadEruptionWarhead: the deployed toxin trooper poisons the ground round it; it hurts nothing itself (the area is ours)
  kind: warhead
  name: Toxin Eruption
  verses: { none: 0%, flak: 0%, plate: 0%, light: 0%, medium: 0%, heavy: 0%, wood: 0%, steel: 0%, concrete: 0%, special_1: 0%, special_2: 0% }
  spread: 2
  radiation: 500

toxin_site:  # RA2 RadSite: what the toxin on the ground does to what stands on it
  kind: warhead
  name: Toxin Ground
  verses: { none: 100%, flak: 100%, plate: 100%, light: 50%, medium: 10%, heavy: 10%, wood: 0%, steel: 0%, concrete: 0%, special_1: 100%, special_2: 100% }
  infantry_death: electro
