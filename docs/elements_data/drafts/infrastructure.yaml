# 01 Ворота. Статус: ждёт решения 5, ждёт M11a.
gate:
  kind: map_object
  blocks: all       # всех наземных, пока закрыты (в документе: blocks: ground)
  crushed_by: []    # гусеницами не давятся (металл)
  burns: false
  garrison: 0
  capturable: false
  # футпринт 1x1 по документу; в схеме footprint только у зданий, не записан
  # открываются своим юнитом владельца, закрываются через паузу; состояние открыто/закрыто в схеме нет
  # файл по документу: game/data/neutral/infrastructure.yaml; индекс ведёт в objects.yaml (расхождение)
  # в документе не задано: hp (как у секции стены, числа нет), close_delay (пауза закрытия, значение в балансе), speed (замедление), stump (пень), explodes (взрыв), height (высота)
